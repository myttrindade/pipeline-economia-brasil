name: economia_brasil
version: "1.0.0"
config-version: 2
profile: economia_brasil

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  economia_brasil:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  economia_brasil:
    +schema: seeds
    series:
      +column_types:
        codigo_serie: integer
